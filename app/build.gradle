apply plugin: 'com.android.application'

android {
    // Local toolchain: Gradle 6.1.1 + Android Gradle Plugin 3.6.3 + JDK 8 +
    // compileSdk/build-tools 28. AGP 3.x uses the *Version DSL, not the newer
    // `compileSdk =` / `namespace` / `buildFeatures.buildConfig` syntax.
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "com.clockmods.nano"
        // API 1 is the minimum supported platform. All high-API calls are
        // guarded in ApiCompat / conditional branches.
        minSdkVersion 1
        targetSdkVersion 28
        resValue "string", "app_name", "ClockMods Nano"
        testInstrumentationRunner project.hasProperty('clockmods.testRunner')
                ? project.property('clockmods.testRunner')
                : 'com.clockmods.ui.FlavorSettingsAcceptance'
        versionCode 1
        versionName "1.0-nano"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        // lint.xml keeps guarded legacy API checks as warnings.
        checkReleaseBuilds false
        lintConfig file('lint.xml')
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // EXIF orientation uses the pure-Java implementation in src/main/java/
    // com/clockmods/platform/ExifOrientationCompat.java (minSdk 1 safe).
    // Offline almanac engine (6tail, MIT, pure Java): lunar date, solar terms,
    // festivals and 宜忌, used by the main clock.
    implementation 'cn.6tail:tyme4j:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
