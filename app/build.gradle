plugins {
    id 'com.android.application'
}

def qweatherProperties = new Properties()
def qweatherFile = rootProject.file('qweather.properties')
if (qweatherFile.isFile()) {
    qweatherFile.withInputStream { qweatherProperties.load(it) }
}
def qweatherValue = { String key, String fallback ->
    def value = qweatherProperties.getProperty(key, fallback)
    return value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.clockmods'
    compileSdk = 36
    compileSdkMinor = 1

    buildFeatures {
        resValues = true
        buildConfig = true
    }
    buildToolsVersion = '36.1.0'

    defaultConfig {
        applicationId "com.clockmods"
        minSdk = 31
        targetSdk = 36
        testInstrumentationRunner "com.clockmods.widget.WidgetAcceptanceInstrumentation"
        versionCode = 1
        versionName = "1.0"
        buildConfigField 'String', 'QWEATHER_API_HOST', '"' + qweatherValue('apiHost', 'devapi.qweather.com') + '"'
        buildConfigField 'String', 'QWEATHER_CREDENTIAL_ID', '"' + qweatherValue('credentialId', '') + '"'
        buildConfigField 'String', 'QWEATHER_DEVELOPER_ID', '"' + qweatherValue('developerId', '') + '"'
        buildConfigField 'String', 'QWEATHER_PROJECT_ID', '"' + qweatherValue('projectId', '') + '"'
        buildConfigField 'String', 'QWEATHER_PRIVATE_KEY_BASE64', '"' + qweatherValue('privateKeyBase64', '') + '"'
    }

    flavorDimensions += "experience"
    productFlavors {
        ultimate {
            dimension "experience"
            applicationIdSuffix ".ultimate"
            versionNameSuffix "-ultimate"
            resValue "string", "app_name", "ClockMods Ultimate"
            manifestPlaceholders = [launcherActivity: ".ultimate.UltimateMainActivity"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Pulled in transitively by appcompat; declared because EdgeToEdge is used directly.
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.window:window:1.5.1'
    implementation 'androidx.window:window-java:1.5.1'
    // Offline almanac engine (6tail, MIT, pure-Java/no deps): lunar date, solar terms, festivals and
    // 宜忌, computed astronomically for years 1–9999. Shared by the main clock (LunarCalendar) and
    // the integrated calendar (LunarAlmanac).
    implementation 'cn.6tail:tyme4j:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'org.apache.commons:commons-csv:1.10.0'
    testImplementation 'org.json:json:20240303'
}
