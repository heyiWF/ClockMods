[package]
name = "clockmods-desktop"
version = "0.1.0"
description = "ClockMods Ultimate desktop clock"
authors = ["ClockMods contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "clockmods_desktop"
crate-type = ["lib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip"] }
futures-util = "0.3"
keepawake = "0.6"

[dev-dependencies]
flate2 = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
