name: Build Desktop on additional Linux architectures
# Opt in with repository variable CLOCKMODS_NATIVE_ARCHES, a JSON array such as
# ["riscv64","loongarch64","armv7","i686"], after registering trusted runners.
# No untrusted PR code is sent to self-hosted machines.
on:
  push:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture label of the native Linux runner
        required: true
        type: choice
        options: [riscv64, loongarch64, armv7, i686]
permissions:
  contents: read
jobs:
  frontend:
    if: github.ref == 'refs/heads/desktop' && (github.event_name == 'workflow_dispatch' || (vars.CLOCKMODS_NATIVE_ARCHES != '' && vars.CLOCKMODS_NATIVE_ARCHES != '[]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci && npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: {name: native-frontend, path: desktop/dist}
  native:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.architecture) || vars.CLOCKMODS_NATIVE_ARCHES || '[]') }}
    runs-on: [self-hosted, Linux, '${{ matrix.architecture }}']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: native-frontend, path: desktop/dist}
      - name: Test and build on target CPU
        shell: bash
        env:
          CLOCKMODS_EXPECT_ARCH: ${{ matrix.architecture }}
        run: bash scripts/build-native.sh
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: clockmods-linux-${{ matrix.architecture }}
          path: desktop/artifacts/*
          if-no-files-found: error
