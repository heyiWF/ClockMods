name: Build APK

on:
  push:
    branches: [nano]
  pull_request:
    branches: [nano]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android 1.0 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project supports API 1 and is pinned to the JDK 8 + Gradle 6.1.1 +
      # AGP 3.6.3 + SDK 28 toolchain (app/build.gradle).
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-28 build-tools;28.0.3'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Package and verify Android 1.0 APK
        run: python3 tools/api1/package_api1.py --build-tools "$ANDROID_HOME/build-tools/28.0.3"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: clockmods-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug-api1-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build APK"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo ""
            echo "| APK | Size |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*-api1-signed.apk' -printf '%p\t%s\n' 2>/dev/null |
              sort | while IFS=$'\t' read -r f s; do
                echo "| \`$f\` | $((s / 1024)) KB |"
              done
          } >> "$GITHUB_STEP_SUMMARY"
