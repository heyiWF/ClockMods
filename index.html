<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ClockMods Pro</title>
    <meta name="description" content="高度可定制的全屏时钟：时钟、月历、番茄钟、闹钟、倒计时、秒表" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClockMods" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <main id="pages">
        <!-- Page order matches the ProPage enum: clock, calendar, pomodoro, alarm, countdown, stopwatch -->

        <section class="page page--immersive is-active" data-page="clock" aria-label="时钟">
          <div class="clock-bg" id="clock-bg"></div>
          <div class="clock-dim" id="clock-dim" hidden></div>
          <div class="clock-stage" id="clock-stage" tabindex="0" role="button">
            <div class="clock-lines" id="clock-lines">
              <div class="supporting-row" id="clock-date" hidden></div>
              <div class="supporting-row" id="clock-lunar" hidden></div>
              <div class="clock-time" id="clock-time"></div>
              <div class="supporting-row carousel-row" id="clock-weather" hidden></div>
              <div class="supporting-row carousel-row" id="clock-detail" hidden></div>
            </div>
          </div>
          <a
            class="weather-attribution"
            id="clock-attribution"
            href="https://www.qweather.com"
            target="_blank"
            rel="noopener"
            hidden
          >
            <img src="./icons/qweather.svg" alt="" aria-hidden="true" />
            <span class="weather-attribution-label">天气服务由和风天气驱动</span>
          </a>
        </section>

        <section class="page page--immersive" data-page="calendar" aria-label="月历">
          <div class="cal-layout">
            <div class="cal-left">
              <div class="cal-panel cal-clock-panel">
                <div class="cal-clock">
                  <span class="cal-time" id="cal-time">--:--</span>
                  <span class="cal-seconds" id="cal-seconds">:--</span>
                  <span class="cal-period" id="cal-period"></span>
                </div>
              </div>
              <div class="cal-panel cal-weather-card" id="cal-weather-card" hidden>
                <div class="cal-weather-main">
                  <span class="cal-weather-icon" id="cal-weather-icon"></span>
                  <span class="cal-temp" id="cal-temp">--℃</span>
                  <span class="cal-feels">
                    <small id="cal-feels-label">体感温度</small>
                    <b id="cal-feels">--℃</b>
                  </span>
                </div>
                <div class="cal-weather-summary" id="cal-weather-summary"></div>
              </div>
              <div class="cal-panel cal-forecast-card" id="cal-forecast-card" hidden>
                <div class="cal-forecast-col" id="cal-forecast-0"></div>
                <div class="cal-forecast-col" id="cal-forecast-1"></div>
                <div class="cal-forecast-col" id="cal-forecast-2"></div>
              </div>
              <a
                class="weather-attribution cal-attribution"
                id="cal-attribution"
                href="https://www.qweather.com"
                target="_blank"
                rel="noopener"
                hidden
              >
                <img src="./icons/qweather.svg" alt="" aria-hidden="true" />
                <span class="weather-attribution-label">天气服务由和风天气驱动</span>
              </a>
            </div>
            <div class="cal-right">
              <div class="cal-panel cal-month-panel" id="cal-month-panel">
                <header class="cal-header">
                  <button class="cal-nav-button" id="cal-prev" type="button" aria-label="上个月">‹</button>
                  <button class="cal-title" id="cal-title" type="button"></button>
                  <button class="cal-today" id="cal-today" type="button">今天</button>
                  <button class="cal-nav-button" id="cal-next" type="button" aria-label="下个月">›</button>
                </header>
                <div class="cal-weekdays" id="cal-weekdays"></div>
                <div class="cal-days-viewport no-page-swipe" id="cal-days-viewport">
                  <div class="cal-days" id="cal-days"></div>
                  <div class="cal-days cal-days--preview" id="cal-days-preview"></div>
                </div>
                <footer class="cal-footer carousel-row" id="cal-footer"></footer>
              </div>
            </div>
          </div>
        </section>

        <section class="page" data-page="pomodoro" aria-label="番茄钟"></section>
        <section class="page" data-page="alarm" aria-label="闹钟"></section>
        <section class="page" data-page="countdown" aria-label="倒计时"></section>
        <section class="page" data-page="stopwatch" aria-label="秒表"></section>
      </main>

      <nav id="nav" aria-label="功能导航">
        <button type="button" data-nav="clock" class="is-active">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm-.75 3v4.5l3.6 2.16.75-1.23-2.85-1.71V8h-1.5Z"
            />
          </svg>
          <span>时钟</span>
        </button>
        <button type="button" data-nav="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 2v2H5.5A2.5 2.5 0 0 0 3 6.5v13A2.5 2.5 0 0 0 5.5 22h13a2.5 2.5 0 0 0 2.5-2.5v-13A2.5 2.5 0 0 0 18.5 4H17V2h-2v2H9V2H7Zm11.5 6H5.5V6.5h13V8Zm0 2v9.5h-13V10h13ZM7 12v2h2v-2H7Zm4 0v2h2v-2h-2Zm4 0v2h2v-2h-2ZM7 16v2h2v-2H7Zm4 0v2h2v-2h-2Z"
            />
          </svg>
          <span>月历</span>
        </button>
        <button type="button" data-nav="pomodoro">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm-1.5 2.75v6.5l5-3.25-5-3.25ZM9 1.5h6V3H9V1.5Z"
            />
          </svg>
          <span>番茄钟</span>
        </button>
        <button type="button" data-nav="alarm">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm-.75 2v4.35l3.3 1.98.75-1.23-2.55-1.53V8h-1.5ZM5.05 2.3 6.1 3.35 3.98 5.47 2.93 4.42 5.05 2.3Zm13.9 0 2.12 2.12-1.05 1.05-2.12-2.12L18.95 2.3Z"
            />
          </svg>
          <span>闹钟</span>
        </button>
        <button type="button" data-nav="countdown">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 1.5H9V3h6V1.5ZM12 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm-.75 1.75v4.5h4.5v-1.5h-3v-3h-1.5Z"
            />
          </svg>
          <span>倒计时</span>
        </button>
        <button type="button" data-nav="stopwatch">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm.75 2h-1.5v5h4v-1.5h-2.5V8ZM9 1.5h6V3H9V1.5Zm9.95.8 2.12 2.12-1.06 1.06-2.12-2.12 1.06-1.06Z"
            />
          </svg>
          <span>秒表</span>
        </button>
      </nav>

      <div id="chime-layer" hidden></div>
      <div id="alarm-layer" hidden></div>
      <div id="settings-root"></div>
      <div id="toast-root" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
