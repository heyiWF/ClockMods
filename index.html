<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="ClockMods Legacy - 兼容 IE 内核的全屏网页时钟" />
    <title>ClockMods Legacy</title>
    <link rel="stylesheet" href="./legacy-clock.css" />
  </head>
  <body>
    <div id="clock-app" class="clock-app">
      <div id="clock-background" class="clock-background"></div>
      <div id="clock-dim" class="clock-dim" hidden></div>

      <main id="clock-face" class="clock-face" tabindex="0" role="button" aria-label="打开设置">
        <div id="clock-lines" class="clock-lines">
          <div id="clock-date" class="clock-date" aria-live="off"></div>
          <div id="clock-lunar" class="clock-lunar" aria-live="off"></div>
          <div id="clock-time" class="clock-time" aria-live="polite">
            <span id="clock-period" class="clock-period"></span>
            <span id="clock-main" class="clock-main">--:--</span>
            <span id="clock-small-seconds" class="clock-small-seconds"></span>
          </div>
          <div id="clock-extra" class="clock-extra">
            <span id="clock-weather" class="clock-weather"></span>
            <span id="clock-message" class="clock-message"></span>
          </div>
        </div>
      </main>

      <div id="clock-toolbar" class="clock-toolbar" aria-label="时钟工具">
        <button id="settings-button" class="tool-button" type="button" title="设置" aria-label="打开设置">&#9881;</button>
        <button id="fullscreen-button" class="tool-button" type="button" title="全屏" aria-label="进入全屏">&#9974;</button>
      </div>
      <div id="clock-status" class="clock-status" role="status" aria-live="polite"></div>

      <div id="settings-overlay" class="settings-overlay" hidden>
        <section id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <header class="settings-header">
            <div>
              <p class="settings-kicker">CLOCKMODS / LEGACY</p>
              <h1 id="settings-title">时钟设置</h1>
            </div>
            <button id="settings-close" class="icon-button" type="button" title="关闭" aria-label="关闭设置">&#10005;</button>
          </header>

          <div class="settings-scroll">
            <fieldset class="settings-section">
              <legend>时间显示</legend>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">时间制式
                  <select id="pref-hour-format" class="field-control">
                    <option value="24">24 小时制</option>
                    <option value="12">12 小时制</option>
                  </select>
                </label>
                <label class="field-label">时区
                  <select id="pref-timezone" class="field-control">
                    <option value="local">跟随系统</option>
                    <option value="utc">UTC</option>
                    <option value="asia-shanghai">中国标准时间 (UTC+8)</option>
                    <option value="asia-tokyo">日本标准时间 (UTC+9)</option>
                    <option value="america-new-york">纽约时间 (UTC-5/-4)</option>
                    <option value="europe-london">伦敦时间 (UTC+0/+1)</option>
                  </select>
                </label>
              </div>
              <div class="settings-grid settings-grid--three check-grid">
                <label class="check-label"><input id="pref-show-seconds" type="checkbox" /> 显示秒数</label>
                <label class="check-label"><input id="pref-small-seconds" type="checkbox" /> 小字号秒数</label>
                <label class="check-label"><input id="pref-blink-colon" type="checkbox" /> 冒号闪烁</label>
                <label class="check-label"><input id="pref-animate" type="checkbox" /> 数字切换动画</label>
                <label class="check-label"><input id="pref-stacked" type="checkbox" /> 竖屏竖排大字</label>
                <label class="check-label"><input id="pref-lunar" type="checkbox" /> 显示农历</label>
                <label class="check-label"><input id="pref-dual-line" type="checkbox" /> 日期与农历分行</label>
                <label class="check-label"><input id="pref-bold" type="checkbox" /> 粗体文字</label>
              </div>
              <div class="settings-grid settings-grid--three check-grid">
                <label class="check-label"><input id="pref-hourly-chime" type="checkbox" /> 整点视觉报时</label>
                <label class="check-label"><input id="pref-chime-quiet" type="checkbox" /> 启用勿扰时段</label>
                <span class="field-help">整点时轻微放大提示</span>
              </div>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">勿扰开始
                  <input id="pref-chime-start" class="field-control" type="time" value="22:00" />
                </label>
                <label class="field-label">勿扰结束
                  <input id="pref-chime-end" class="field-control" type="time" value="07:00" />
                </label>
              </div>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">数字切换动效
                  <select id="pref-transition" class="field-control">
                    <option value="fade">淡入淡出</option>
                    <option value="slide">上滑</option>
                    <option value="scale">缩放</option>
                    <option value="flip">翻页</option>
                  </select>
                </label>
                <label class="field-label">字体
                  <select id="pref-font" class="field-control">
                    <option value="system">系统无衬线</option>
                    <option value="segoe">Segoe UI / 微软雅黑</option>
                    <option value="roboto">Roboto（已安装时使用）</option>
                    <option value="serif">衬线字体</option>
                    <option value="mono">等宽字体</option>
                  </select>
                </label>
              </div>
            </fieldset>

            <fieldset class="settings-section">
              <legend>日期与文字</legend>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">显示语言
                  <select id="pref-language" class="field-control">
                    <option value="zh-Hans">简体中文</option>
                    <option value="zh-Hant">繁體中文</option>
                    <option value="en">English</option>
                  </select>
                </label>
                <label class="field-label">日期格式
                  <input id="pref-date-pattern" class="field-control" type="text" maxlength="80" value="yyyy年M月d日 EEEE" />
                </label>
              </div>
              <p class="field-help">支持 yyyy、yy、M、MM、MMM、MMMM、d、dd、E、EEEE；文字可用单引号包住。</p>
              <label class="field-label">自定义留言
                <input id="pref-message" class="field-control" type="text" maxlength="120" placeholder="留空则隐藏，例如：专注当下" />
              </label>
              <div class="settings-grid settings-grid--two">
                <label class="range-label">时间字号 <span id="pref-time-scale-value">88%</span>
                  <input id="pref-time-scale" type="range" min="40" max="145" step="1" />
                </label>
                <label class="range-label">日期字号 <span id="pref-date-scale-value">55%</span>
                  <input id="pref-date-scale" type="range" min="25" max="100" step="1" />
                </label>
              </div>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">时间颜色
                  <input id="pref-time-color" class="color-control" type="color" value="#ffffff" />
                </label>
                <label class="field-label">日期颜色
                  <input id="pref-date-color" class="color-control" type="color" value="#ffffff" />
                </label>
              </div>
            </fieldset>

            <fieldset class="settings-section">
              <legend>背景</legend>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">背景颜色
                  <input id="pref-background-color" class="color-control" type="color" value="#101418" />
                </label>
                <label class="field-label">背景图片
                  <input id="pref-background-file" class="field-control file-control" type="file" accept="image/*" />
                </label>
              </div>
              <div class="button-row">
                <button id="clear-background" class="secondary-button" type="button">清除图片并使用纯色</button>
                <span id="background-name" class="field-help">未选择图片</span>
              </div>
              <div class="settings-grid settings-grid--three check-grid">
                <label class="check-label"><input id="pref-use-image" type="checkbox" /> 使用背景图片</label>
                <label class="check-label"><input id="pref-dim" type="checkbox" /> 背景压暗</label>
                <label class="check-label"><input id="pref-schedule-dim" type="checkbox" /> 按时段压暗</label>
              </div>
              <div class="settings-grid settings-grid--two">
                <label class="field-label">压暗开始
                  <input id="pref-dim-start" class="field-control" type="time" value="22:00" />
                </label>
                <label class="field-label">压暗结束
                  <input id="pref-dim-end" class="field-control" type="time" value="06:00" />
                </label>
              </div>
            </fieldset>

            <fieldset class="settings-section">
              <legend>网络功能</legend>
              <label class="check-label"><input id="pref-weather" type="checkbox" /> 显示实时天气</label>
              <div class="settings-grid settings-grid--two compact-top">
                <label class="field-label">天气代理地址
                  <input id="pref-weather-url" class="field-control" type="text" maxlength="240" placeholder="https://example.com/weather" />
                </label>
                <label class="field-label">城市 ID / 查询参数
                  <input id="pref-weather-location" class="field-control" type="text" maxlength="80" placeholder="101280601" />
                </label>
              </div>
              <label class="field-label">天气更新频率
                <select id="pref-weather-interval" class="field-control">
                  <option value="10">每 10 分钟</option>
                  <option value="30">每 30 分钟</option>
                  <option value="60">每小时</option>
                  <option value="180">每 3 小时</option>
                  <option value="360">每 6 小时</option>
                  <option value="720">每 12 小时</option>
                </select>
              </label>
              <p class="field-help">代理应返回 JSON：city、text、temperature、icon；也兼容和风天气 now.results 格式。IE 无法安全保存私钥，建议使用服务端代理。</p>
              <div class="settings-grid settings-grid--two">
                <label class="check-label"><input id="pref-network-time" type="checkbox" /> 使用网络时间</label>
                <label class="field-label">校时地址
                  <input id="pref-time-url" class="field-control" type="text" maxlength="240" placeholder="留空则请求当前站点" />
                </label>
              </div>
              <label class="field-label">同步频率
                <select id="pref-sync-interval" class="field-control">
                  <option value="30">每 30 分钟</option>
                  <option value="60">每小时</option>
                  <option value="360">每 6 小时</option>
                  <option value="1440">每天</option>
                </select>
              </label>
            </fieldset>
          </div>

          <footer class="settings-footer">
            <button id="settings-reset" class="text-button" type="button">恢复默认</button>
            <span class="settings-footer-spacer"></span>
            <button id="settings-cancel" class="secondary-button" type="button">取消</button>
            <button id="settings-apply" class="primary-button" type="button">应用设置</button>
          </footer>
        </section>
      </div>
    </div>

    <noscript><div class="no-script">此页面需要启用 JavaScript 才能显示时钟。</div></noscript>
    <script src="./legacy-lunar.js"></script>
    <script src="./legacy-clock.js"></script>
  </body>
</html>
